services:
  ultimate-dash:
    build: .
    container_name: ultimate-dash
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    # Optionale Einstellungen: cp .env.example .env und dort eintragen.
    # Erklärung aller Variablen: docs/anleitungen/konfiguration.md
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
