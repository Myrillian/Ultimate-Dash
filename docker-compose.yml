services:
  ultimate-dash:
    build: .
    container_name: ultimate-dash
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      # Abstand der Statusprüfungen in Sekunden
      STATUS_INTERVAL_SECONDS: 60
      # Optional: Anmeldung über OIDC (siehe README)
      # OIDC_ISSUER: https://auth.example.org/application/o/ultimate-dash/
      # OIDC_CLIENT_ID: ultimate-dash
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_BUTTON_LABEL: Mit Authentik anmelden
      # OIDC_ADMIN_GROUPS: homelab-admins
    restart: unless-stopped
