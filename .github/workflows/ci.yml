name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: ultimate-dash:ci
      - name: Startprobe mit root-eigenem Datenordner
        run: |
          # Wie auf einem frischen Host: Docker legt ./data als root an.
          sudo mkdir -p "$RUNNER_TEMP/data" && sudo chown root:root "$RUNNER_TEMP/data"
          docker run -d --name ud -p 3000:3000 -v "$RUNNER_TEMP/data:/data" ultimate-dash:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; break; fi
            sleep 1
          done
          docker logs ud
          curl -fsS http://127.0.0.1:3000/api/health
          # App läuft nicht als root, Datenbank gehört node
          test "$(docker exec ud stat -c %u /proc/1)" = "1000"
          test "$(sudo stat -c %u "$RUNNER_TEMP/data/ultimate-dash.db")" = "1000"
