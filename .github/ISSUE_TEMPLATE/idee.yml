name: Idee oder Wunsch
description: Neue Funktion oder Verbesserung vorschlagen.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Wie stellst du dir die Lösung vor?
  - type: textarea
    id: alternativen
    attributes:
      label: Alternativen oder Beispiele aus anderen Projekten
